<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TestTeam — every sprint, every project, one view</title>
    <meta name="description" content="Cross-project sprint rollups, one-click CSV export, and a weekly digest your team actually reads." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M9 16h5v7H9zM18 9h5v14h-5z' fill='%23fff'/%3E%3C/svg%3E" />
    <script>
      // Apply the saved theme before first paint so the page never flashes.
      (function () {
        try {
          var saved = localStorage.getItem('tt-theme')
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
